<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject-wise Failed Students</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        body {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 56px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .intro {
            margin-top: 0;
            color: #526078;
        }

        #status {
            margin: 24px 0;
            color: #526078;
        }

        #status.error {
            color: #b42318;
        }

        #subject-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
        }

        #subject-nav button {
            padding: 8px 12px;
            border: 1px solid #c7d6f2;
            border-radius: 6px;
            background: #e7efff;
            color: #174ea6;
            cursor: pointer;
            font: inherit;
        }

        #subject-nav button:hover,
        #subject-nav button:focus-visible {
            background: #d6e5ff;
        }

        .subject-section {
            margin-top: 24px;
            overflow: hidden;
            border: 1px solid #dce3ee;
            border-radius: 10px;
            background: #fff;
        }

        .subject-section h2 {
            margin: 0;
            padding: 16px 18px;
            background: #eaf0fa;
            font-size: 1.2rem;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px 18px;
            border-top: 1px solid #e5eaf2;
            text-align: left;
        }

        th {
            background: #f8faff;
        }

        #results[hidden],
        #results:empty {
            display: none;
        }

        #summary[hidden] {
            display: none;
        }

        .summary {
            margin-top: 24px;
            padding: 18px;
            border: 1px solid #dce3ee;
            border-radius: 10px;
            background: #fff;
        }

        .summary h2 {
            margin: 0 0 16px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
        }

        .summary-card {
            min-width: 0;
            padding: 14px;
            border-radius: 8px;
            background: #f3f6fb;
        }

        .summary-card-label {
            display: block;
            margin-bottom: 8px;
            color: #526078;
            font-size: 0.9rem;
        }

        .summary-card-value {
            display: block;
            font-size: 1.25rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .summary h3 {
            margin: 22px 0 8px;
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 22px 12px 40px;
            }
        }
    </style>
</head>
<body>
    <h1>Subject-wise Failed Students</h1>
    <p class="intro">Students are listed in a separate table for each subject they failed.</p>

    <nav id="subject-nav" aria-label="Jump to a subject"></nav>
    <section id="summary" class="summary" aria-labelledby="summary-title" hidden>
        <h2 id="summary-title">Failure Summary</h2>
        <div id="summary-cards" class="summary-cards"></div>
        <h3>Subject-wise failed students</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Subject</th>
                        <th scope="col">Failed students</th>
                    </tr>
                </thead>
                <tbody id="subject-summary"></tbody>
            </table>
        </div>
    </section>
    <p id="status" role="status">Loading student records…</p>
    <main id="results" hidden></main>

    <script>
        const status = document.getElementById("status");
        const subjectNav = document.getElementById("subject-nav");
        const summary = document.getElementById("summary");
        const summaryCards = document.getElementById("summary-cards");
        const subjectSummary = document.getElementById("subject-summary");
        const results = document.getElementById("results");

        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = "";
            let insideQuotes = false;

            for (let i = 0; i < text.length; i += 1) {
                const character = text[i];

                if (insideQuotes) {
                    if (character === '"' && text[i + 1] === '"') {
                        field += '"';
                        i += 1;
                    } else if (character === '"') {
                        insideQuotes = false;
                    } else {
                        field += character;
                    }
                } else if (character === '"' && field.length === 0) {
                    insideQuotes = true;
                } else if (character === ",") {
                    row.push(field);
                    field = "";
                } else if (character === "\n" || character === "\r") {
                    row.push(field);
                    if (row.some(value => value.trim() !== "")) {
                        rows.push(row);
                    }
                    row = [];
                    field = "";
                    if (character === "\r" && text[i + 1] === "\n") {
                        i += 1;
                    }
                } else {
                    field += character;
                }
            }

            if (insideQuotes) {
                throw new Error("The CSV has an unfinished quoted field.");
            }

            row.push(field);
            if (row.some(value => value.trim() !== "")) {
                rows.push(row);
            }
            return rows;
        }

        function makeCell(tagName, value) {
            const cell = document.createElement(tagName);
            cell.textContent = value;
            return cell;
        }

        function makeSummaryCard(label, value) {
            const card = document.createElement("div");
            card.className = "summary-card";

            const cardLabel = document.createElement("span");
            cardLabel.className = "summary-card-label";
            cardLabel.textContent = label;
            card.appendChild(cardLabel);

            const cardValue = document.createElement("span");
            cardValue.className = "summary-card-value";
            cardValue.textContent = value;
            card.appendChild(cardValue);

            return card;
        }

        function renderTables(csvText) {
            const rows = parseCsv(csvText);
            if (rows.length < 2) {
                throw new Error("The CSV does not contain any student records.");
            }

            const headers = rows[0].map(value => value.trim().replace(/^\uFEFF/, ""));
            const rollIndex = headers.indexOf("Roll_No");
            const nameIndex = headers.indexOf("Student_Name");
            const subjectsIndex = headers.indexOf("Failed_Subjects_12th");
            if (rollIndex < 0 || nameIndex < 0 || subjectsIndex < 0) {
                throw new Error("Required columns are missing: Roll_No, Student_Name, and Failed_Subjects_12th.");
            }

            const studentsBySubject = new Map();
            const failedStudentRollNumbers = new Set();
            for (const values of rows.slice(1)) {
                const rollNumber = (values[rollIndex] || "").trim();
                const studentName = (values[nameIndex] || "").trim();
                const failedSubjects = (values[subjectsIndex] || "")
                    .split(",")
                    .map(subject => subject.trim())
                    .filter(Boolean);

                if (!rollNumber || !studentName) {
                    continue;
                }

                for (const subject of new Set(failedSubjects)) {
                    if (!studentsBySubject.has(subject)) {
                        studentsBySubject.set(subject, new Map());
                    }
                    studentsBySubject.get(subject).set(rollNumber, { rollNumber, studentName });
                    failedStudentRollNumbers.add(rollNumber);
                }
            }

            if (studentsBySubject.size === 0) {
                throw new Error("No failed-subject records were found in the CSV.");
            }

            const collator = new Intl.Collator(undefined, { numeric: true });
            const subjects = [...studentsBySubject.keys()].sort((first, second) => collator.compare(first, second));
            const fragment = document.createDocumentFragment();
            const navFragment = document.createDocumentFragment();
            const summaryCardsFragment = document.createDocumentFragment();
            const subjectSummaryFragment = document.createDocumentFragment();
            const subjectFailCounts = subjects.map(subject => ({
                subject,
                count: studentsBySubject.get(subject).size
            }));
            const highestFailureCount = Math.max(...subjectFailCounts.map(item => item.count));
            const mostFailedSubjects = subjectFailCounts
                .filter(item => item.count === highestFailureCount)
                .map(item => item.subject);

            summaryCardsFragment.appendChild(makeSummaryCard(
                "Total failed students",
                failedStudentRollNumbers.size.toLocaleString()
            ));
            summaryCardsFragment.appendChild(makeSummaryCard(
                `Most failed subject${mostFailedSubjects.length > 1 ? "s" : ""} (${highestFailureCount.toLocaleString()})`,
                mostFailedSubjects.join(", ")
            ));

            for (const item of subjectFailCounts) {
                const row = document.createElement("tr");
                row.appendChild(makeCell("td", item.subject));
                row.appendChild(makeCell("td", item.count.toLocaleString()));
                subjectSummaryFragment.appendChild(row);
            }

            for (const [index, subject] of subjects.entries()) {
                const section = document.createElement("section");
                section.className = "subject-section";
                section.id = `subject-${index}`;

                const heading = document.createElement("h2");
                heading.textContent = `${subject} — ${studentsBySubject.get(subject).size} students`;
                section.appendChild(heading);

                const subjectButton = document.createElement("button");
                subjectButton.type = "button";
                subjectButton.textContent = subject;
                subjectButton.addEventListener("click", () => {
                    section.scrollIntoView({ behavior: "smooth", block: "start" });
                });
                navFragment.appendChild(subjectButton);

                const tableWrap = document.createElement("div");
                tableWrap.className = "table-wrap";
                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                headerRow.appendChild(makeCell("th", "Roll Number"));
                headerRow.appendChild(makeCell("th", "Student Name"));
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                const students = [...studentsBySubject.get(subject).values()].sort(
                    (first, second) => collator.compare(first.rollNumber, second.rollNumber)
                );
                for (const student of students) {
                    const studentRow = document.createElement("tr");
                    studentRow.appendChild(makeCell("td", student.rollNumber));
                    studentRow.appendChild(makeCell("td", student.studentName));
                    tbody.appendChild(studentRow);
                }
                table.appendChild(tbody);
                tableWrap.appendChild(table);
                section.appendChild(tableWrap);
                fragment.appendChild(section);
            }

            summaryCards.replaceChildren(summaryCardsFragment);
            subjectSummary.replaceChildren(subjectSummaryFragment);
            summary.hidden = false;
            results.replaceChildren(fragment);
            subjectNav.replaceChildren(navFragment);
            results.hidden = false;
        }
